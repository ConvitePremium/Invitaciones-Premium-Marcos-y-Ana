<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Invitación de boda</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#201b1c;color:#fff;font-family:Georgia,serif}button,input,select,textarea{font:inherit}button{cursor:pointer}#app{min-height:100dvh;display:grid;place-items:center;padding:10px}.stage{width:min(100%,calc(100dvh * .5625 - 16px),520px);aspect-ratio:9/16;position:relative;overflow:hidden;background:linear-gradient(155deg,#f9f1e7,#e9d9c3);box-shadow:0 15px 60px #0008;color:#3c2e25}.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}.fallback{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 20%,#fff9ed 0%,#ead7bb 60%,#b99a79 100%)}.fallback:after{content:'✦';position:absolute;top:10%;left:46%;font-size:55px;color:#b88c50;opacity:.4}.area{position:absolute;display:grid;place-items:center;touch-action:none}.hotspot{background:#4e3021ad;color:white;border:1px solid #e9d5ad;border-radius:100px;text-align:center;font-size:clamp(9px,1.9vw,13px);padding:5px;line-height:1.15;text-shadow:0 1px 2px #0007}.countdown-panel{width:100%;height:100%;display:flex;align-items:center;justify-content:center;gap:2%;padding:2%;border-radius:12px;background:#fff9efdf;border:1px solid #caa66a;color:#5b4532;font-family:Georgia,serif;overflow:hidden}.countdown-unit{flex:1;min-width:0;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center}.countdown-number{font-size:var(--count-size,20px);font-weight:bold;line-height:1.1;white-space:nowrap}.countdown-label{font-size:var(--label-size,9px);text-transform:uppercase;letter-spacing:.04em}.countdown-finished{font-size:var(--finish-size,15px);line-height:1.15;text-align:center;overflow-wrap:anywhere;padding:0 4%}.hotspot:hover{background:#5e382ac9}.content{position:absolute;overflow:hidden}.text-panel{font-family:Georgia,serif;line-height:1.55;font-size:clamp(12px,2.4vw,18px);text-align:center;white-space:pre-wrap;overflow:auto;padding:10px 12px;background:#fff8f0cf;color:#503c2e;border-radius:12px;box-shadow:0 3px 15px #0001}.back{background:#50362ccc;border:1px solid #e6c78d;color:white;border-radius:100px;width:100%;height:100%;font-size:12px}.page-title{position:absolute;top:10%;left:8%;width:84%;text-align:center;font-size:clamp(20px,5vw,34px);font-style:italic;color:#6c5141;text-shadow:0 1px 0 #fff}.stack{position:absolute;inset:0;perspective:900px}.polaroid{position:absolute;left:50%;top:50%;width:57%;height:90%;background:#fff;padding:3.5% 3.5% 12%;box-shadow:0 12px 24px #0005;border:1px solid #ddd;transform-origin:50% 75%;transition:transform .5s ease,opacity .5s ease;display:flex;align-items:center;justify-content:center}.polaroid img{width:100%;height:100%;object-fit:cover}.photo-placeholder{width:100%;height:100%;display:grid;place-items:center;text-align:center;font:12px Arial,sans-serif;color:#756d66;background:linear-gradient(130deg,#e6d4c6,#d2bda7);padding:8px}.arrow{position:absolute;z-index:20;top:43%;width:36px;height:36px;border-radius:50%;border:1px solid #bd9861;background:#fffdf2eb;color:#634b31;font-size:24px;display:grid;place-items:center}.arrow.left{left:0}.arrow.right{right:0}.location-details{position:absolute;top:30%;left:10%;width:80%;background:#fff9efdc;padding:15px;border-radius:12px;text-align:center;font-size:clamp(12px,2.5vw,16px);color:#60462d}.location-details p{margin:8px 0 18px}.modal-shade{position:fixed;inset:0;background:#000a;display:grid;place-items:center;padding:20px;z-index:200}.modal{background:#fffaf3;color:#3b3026;border-radius:16px;padding:25px;width:min(420px,100%);max-height:90dvh;overflow:auto;box-shadow:0 12px 40px #0005}.modal h2{margin:0 0 16px;text-align:center}.modal label{display:block;margin:12px 0 6px;font-size:14px}.modal select,.modal input{width:100%;padding:12px;border:1px solid #cbb89f;border-radius:8px;background:white}.modal button{padding:12px 15px;border-radius:8px;border:0;background:#76563b;color:white}.modal .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}.modal .secondary{background:#ddd4ca;color:#34291d}#editor{position:fixed;z-index:100;top:10px;right:10px;width:min(340px,95vw);max-height:95dvh;overflow:auto;background:#fff;color:#27211b;border-radius:12px;padding:14px;font:13px Arial,sans-serif;box-shadow:0 5px 30px #0006}#editor label{display:block;margin:8px 0 4px}#editor select,#editor input,#editor textarea{width:100%;padding:6px;border:1px solid #aaa;border-radius:4px}#editor textarea{height:120px;font:11px monospace}#editor button{padding:8px;margin:5px 3px 5px 0}.editor-mode .area.editable{outline:2px dashed #ed3879;background:#f8a2bc35;cursor:move}.editor-mode .area.editable.selected{outline:3px solid #f13d64}.handle{display:none;position:absolute;right:-7px;bottom:-7px;width:17px;height:17px;background:#e8345b;border:2px solid #fff;border-radius:50%;cursor:nwse-resize}.editor-mode .selected .handle{display:block}.hidden{display:none!important}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#29231c;color:white;padding:10px 20px;border-radius:10px;z-index:300}.music{position:fixed;bottom:12px;left:12px;z-index:70;border-radius:50%;background:#fffbdc;color:#4b3928;border:0;width:40px;height:40px} @media(max-width:800px){#editor{top:auto;bottom:0;right:0;width:100%;max-height:35dvh;border-radius:14px 14px 0 0}.editor-mode #app{padding-bottom:35dvh}.editor-mode .stage{width:min(100%,calc(65dvh * .5625))}.hotspot{font-size:10px}}
</style></head><body><div id="app"><main id="stage" class="stage"></main></div><button id="music" class="music" title="Música" aria-label="Activar música">♫</button><audio id="audio" loop preload="none"></audio><section id="editor" class="hidden"><b>Editor de posições — em português</b><div>Arraste a área marcada; use a bolinha no canto para redimensionar.</div><label>Área</label><select id="areaSelect"></select><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:5px"><label>X<input id="x" type="number" step="0.1"></label><label>Y<input id="y" type="number" step="0.1"></label><label>L<input id="w" type="number" step="0.1"></label><label>A<input id="h" type="number" step="0.1"></label></div><button id="save">Salvar no navegador</button><button id="copy">Copiar código</button><button id="reset">Restaurar</button><button id="closeEditor">Fechar</button><label>Posições para colar no config.js</label><textarea id="code" readonly></textarea><div style="font-size:11px">Para testar outra página, use os botões no convite. A edição não é mostrada aos convidados.</div></section><div id="modalRoot"></div><script src="config.js"></script><script>
(()=>{'use strict';const C=window.CONFIG,stage=document.querySelector('#stage'),editor=document.querySelector('#editor'),sel=document.querySelector('#areaSelect'),root=document.querySelector('#modalRoot');const clone=x=>JSON.parse(JSON.stringify(x));let positions=clone(C.posicoes),page='abertura',selected='confirmar',isEditor=new URLSearchParams(location.search).has('editor'),typingTimer=null,photoIndex=0,countdownTimer=null;const storage='convite-es-editor:'+location.pathname;try{positions={...positions,...JSON.parse(localStorage.getItem(storage)||'{}')}}catch(e){};const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function area(key,html,extra=''){let p=positions[key]||{x:10,y:10,w:40,h:10};return `<div class="area editable ${extra}" data-area="${key}" style="left:${p.x}%;top:${p.y}%;width:${p.w}%;height:${p.h}%">${html}<span class="handle"></span></div>`}function imageBg(path){return `<div class="fallback"></div><img class="bg" src="${esc(path)}" onerror="this.style.display='none'">`};function nav(){return area('voltar','<button class="back" data-action="voltar">← Volver al inicio</button>')};function textBox(key,id){return area(key,`<div class="text-panel" id="${id}" style="width:100%;height:100%"></div>`)}function makePage(next){page=next;clearInterval(typingTimer);clearInterval(countdownTimer);let html='';if(next==='abertura'){html=imageBg(C.imagens.abertura)+`<button data-action="entrar" style="position:absolute;inset:0;border:0;background:transparent;width:100%;height:100%;color:#fff;text-shadow:0 2px 5px #000;font-size:20px;display:flex;align-items:end;justify-content:center;padding-bottom:12%">Pulsa para abrir la invitación ✦</button>`}else if(next==='principal'){html=imageBg(C.imagens.principal)+area('confirmar','<button class="hotspot" style="width:100%;height:100%" data-action="confirmar">Confirmar asistencia</button>')+area('localizacao','<button class="hotspot" style="width:100%;height:100%" data-action="localizacao">Ubicación</button>')+area('dresscode','<button class="hotspot" style="width:100%;height:100%" data-action="dresscode">Dress Code</button>')+area('historiaBotao','<button class="hotspot" style="width:100%;height:100%" data-action="historia">Nuestra Historia</button>')+area('mensagemBotao','<button class="hotspot" style="width:100%;height:100%" data-action="mensagem">Un mensaje para ti</button>')+area('contagem','<div class="countdown-panel" id="countdownPanel" aria-label="Cuenta atrás para la boda"></div>')}else if(next==='dresscode'){html=imageBg(C.imagens.dresscode)+nav()}else if(next==='localizacao'){const l=C.localizacao;html=imageBg(C.imagens.localizacao)+`<h1 class="page-title">${esc(l.titulo)}</h1><div class="location-details"><strong>${esc(l.cerimonia.nome)} · ${esc(l.cerimonia.hora)}</strong><p>${esc(l.cerimonia.endereco)}</p><strong>${esc(l.recepcao.nome)} · ${esc(l.recepcao.hora)}</strong><p>${esc(l.recepcao.endereco)}</p></div>`+area('cerimonia','<button class="hotspot" style="width:100%;height:100%" data-action="cerimonia">Cómo llegar a la ceremonia</button>')+area('recepcao','<button class="hotspot" style="width:100%;height:100%" data-action="recepcao">Cómo llegar a la celebración</button>')+nav()}else if(next==='historia'){html=imageBg(C.imagens.historia)+`<h1 class="page-title">Nuestra Historia</h1>`+area('fotos','<div class="stack" id="stack" style="width:100%;height:100%"></div><button class="arrow left" data-action="prev" aria-label="Foto anterior">‹</button><button class="arrow right" data-action="next" aria-label="Foto siguiente">›</button>')+textBox('textoHistoria','historiaText')+nav()}else if(next==='mensagem'){html=imageBg(C.imagens.mensagem)+`<h1 class="page-title">Un mensaje para ti</h1>`+textBox('textoMensagem','mensajeText')+nav()}stage.innerHTML=html;attachEvents();if(next==='principal'){updateCountdown();countdownTimer=setInterval(updateCountdown,1000)}if(next==='historia'){renderPhotos();typeText('historiaText',C.historia.texto)}if(next==='mensagem')typeText('mensajeText',C.mensagem.texto);if(isEditor)selectArea(selected)}function updateCountdown(){const el=$('countdownPanel');if(!el)return;const rect=el.getBoundingClientRect();const w=rect.width,h=rect.height;el.style.setProperty('--count-size',Math.max(8,Math.min(w/7.8,h*.36))+'px');el.style.setProperty('--label-size',Math.max(6,Math.min(w/21,h*.17))+'px');el.style.setProperty('--finish-size',Math.max(8,Math.min(w/13,h*.38))+'px');const target=new Date(C.dataEvento).getTime();if(!Number.isFinite(target)){el.innerHTML='<div class="countdown-finished">Fecha no configurada</div>';return}const diff=Math.max(0,target-Date.now());if(diff===0){el.innerHTML='<div class="countdown-finished">'+esc(C.contagem?.mensagemFinal||'¡La celebración ha comenzado!')+'</div>';return}const units=[['Días',Math.floor(diff/86400000)],['Horas',Math.floor(diff/3600000)%24],['Min',Math.floor(diff/60000)%60],['Seg',Math.floor(diff/1000)%60]];el.innerHTML=units.map(([label,n],i)=>'<div class="countdown-unit"><span class="countdown-number">'+(i===0?n:String(n).padStart(2,'0'))+'</span><span class="countdown-label">'+label+'</span></div>').join('')}function typeText(id,text){const node=$(id);if(!node)return;let i=0;node.textContent='';const t=String(text||'');if(window.matchMedia('(prefers-reduced-motion: reduce)').matches||isEditor){node.textContent=t;return}typingTimer=setInterval(()=>{node.textContent=t.slice(0,++i);if(i>=t.length)clearInterval(typingTimer)},Math.max(10,C.animacao.velocidadeDigitacao||35));node.addEventListener('click',()=>{clearInterval(typingTimer);node.textContent=t},{once:true})}function renderPhotos(){const n=clamp(Number(C.historia.quantidadeFotos)||4,3,6),paths=C.historia.fotos.slice(0,n);const holder=$('stack');if(!holder)return;holder.innerHTML=paths.map((path,j)=>{let d=(j-photoIndex+n)%n;const rot=d===0?0:(d%2?1:-1)*(5+Math.floor(d/2)*3);const x=d===0?0:(d%2?1:-1)*(12+Math.floor(d/2)*5);const scale=1-d*.075;return `<div class="polaroid" style="z-index:${n-d};transform:translate(-50%,-50%) translateX(${x}%) rotate(${rot}deg) scale(${scale});opacity:${1-d*.10}"><img src="${esc(path)}" alt="Foto ${j+1}" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'photo-placeholder',textContent:'Foto ${j+1} · ${esc(path)}'}))"></div>`}).join('')}function showModal(){root.innerHTML=`<div class="modal-shade"><form class="modal" id="rsvp"><h2>Confirmar asistencia</h2><label for="count">¿Cuántas personas asistirán?</label><select id="count">${Array.from({length:9},(_,i)=>`<option value="${i+1}">${i+1}</option>`).join('')}</select><div id="names"></div><div class="actions"><button type="button" class="secondary" id="cancel">Cancelar</button><button type="submit">Enviar por WhatsApp</button></div></form></div>`;function names(){const n=Number($('count').value);$('names').innerHTML=Array.from({length:n},(_,i)=>`<label for="name${i}">Nombre completo ${i+1}</label><input id="name${i}" required maxlength="90" placeholder="Nombre y apellido" autocomplete="name">`).join('')};$('count').onchange=names;names();$('cancel').onclick=()=>root.innerHTML='';root.querySelector('.modal-shade').onclick=e=>{if(e.target.classList.contains('modal-shade'))root.innerHTML=''};$('rsvp').onsubmit=e=>{e.preventDefault();const n=Number($('count').value),names=Array.from({length:n},(_,i)=>$('name'+i).value.trim());if(names.some(x=>!x)){alert('Introduce todos los nombres.');return}const number=String(C.whatsapp||'').replace(/\D/g,'');if(number.length<9){alert('Configura primero el número de WhatsApp en config.js.');return}const message=`¡Hola! Confirmamos nuestra asistencia a la boda de ${C.casal}.\nPersonas: ${n}\nNombres:\n${names.map((v,i)=>`${i+1}. ${v}`).join('\n')}`;window.open('https://wa.me/'+number+'?text='+encodeURIComponent(message),'_blank','noopener,noreferrer');root.innerHTML=''}}function attachEvents(){stage.querySelectorAll('[data-action]').forEach(btn=>btn.addEventListener('click',e=>{if(isEditor&&e.target.closest('.editable')&&e.target.closest('.editable').classList.contains('selected'))return;const a=btn.dataset.action;if(a==='entrar'){makePage('principal');startMusic()}else if(a==='voltar')makePage('principal');else if(a==='confirmar')showModal();else if(['localizacao','dresscode','historia','mensagem'].includes(a))makePage(a);else if(a==='next'||a==='prev'){photoIndex=(photoIndex+(a==='next'?1:-1)+clamp(C.historia.quantidadeFotos,3,6))%clamp(C.historia.quantidadeFotos,3,6);renderPhotos()}else if(a==='cerimonia'||a==='recepcao'){const url=C.localizacao[a].mapa;if(/^https:\/\//i.test(url))window.open(url,'_blank','noopener,noreferrer')}}));stage.querySelectorAll('.editable').forEach(el=>{el.addEventListener('pointerdown',e=>{if(!isEditor)return;if(e.target.closest('button')&&!e.target.classList.contains('handle'))e.preventDefault();const key=el.dataset.area;selectArea(key);const p=positions[key],startX=e.clientX,startY=e.clientY,initial={...p},resize=e.target.classList.contains('handle');el.setPointerCapture(e.pointerId);const move=ev=>{const dx=(ev.clientX-startX)/stage.clientWidth*100,dy=(ev.clientY-startY)/stage.clientHeight*100;if(resize){p.w=clamp(initial.w+dx,8,100-p.x);p.h=clamp(initial.h+dy,4,100-p.y)}else{p.x=clamp(initial.x+dx,0,100-p.w);p.y=clamp(initial.y+dy,0,100-p.h)}setAreaStyle(el,p);if(key==='contagem')updateCountdown();fillEditor()};const up=()=>{el.removeEventListener('pointermove',move);el.removeEventListener('pointerup',up)};el.addEventListener('pointermove',move);el.addEventListener('pointerup',up)})})}function setAreaStyle(el,p){el.style.left=p.x+'%';el.style.top=p.y+'%';el.style.width=p.w+'%';el.style.height=p.h+'%'}const labels={contagem:'Contagem regressiva (página principal)',confirmar:'Confirmar asistencia',localizacao:'Ubicación',dresscode:'Dress Code',historiaBotao:'Nuestra Historia (botão)',mensagemBotao:'Un mensaje para ti (botão)',fotos:'Galeria de fotos',textoHistoria:'Texto Nuestra Historia',textoMensagem:'Texto Un mensaje para ti',cerimonia:'Botão Cerimônia',recepcao:'Botão Recepção',voltar:'Botão Voltar'};function selectArea(key){selected=key;sel.value=key;stage.querySelectorAll('.editable').forEach(el=>el.classList.toggle('selected',el.dataset.area===key));fillEditor()}function fillEditor(){const p=positions[selected];if(!p)return;['x','y','w','h'].forEach(k=>$(k).value=Number(p[k]).toFixed(2));$('code').value='posicoes: '+JSON.stringify(positions,null,2)}function startMusic(){if(!C.musica.ativa)return;const a=$('audio');a.src=C.musica.arquivo;a.volume=clamp(C.musica.volume||.3,0,1);a.play().catch(()=>{})}const music=$('music');music.onclick=()=>{const a=$('audio');if(a.paused){startMusic();music.textContent='♫'}else{a.pause();music.textContent='♪'}};if(isEditor){document.body.classList.add('editor-mode');editor.classList.remove('hidden');Object.entries(labels).forEach(([key,label])=>{const opt=document.createElement('option');opt.value=key;opt.textContent=label;sel.appendChild(opt)});sel.onchange=()=>selectArea(sel.value);['x','y','w','h'].forEach(k=>$(k).oninput=()=>{const p=positions[selected];p[k]=Number($(k).value);const el=stage.querySelector(`[data-area="${selected}"]`);if(el)setAreaStyle(el,p);if(selected==='contagem')updateCountdown();$('code').value='posicoes: '+JSON.stringify(positions,null,2)});$('save').onclick=()=>{localStorage.setItem(storage,JSON.stringify(positions));alert('Posições salvas neste navegador.')};$('copy').onclick=()=>{const code='posicoes: '+JSON.stringify(positions,null,2);navigator.clipboard.writeText(code).then(()=>alert('Código copiado. Cole em config.js.')).catch(()=>{prompt('Copie o código:',code)})};$('reset').onclick=()=>{if(confirm('Restaurar as posições originais?')){positions=clone(C.posicoes);localStorage.removeItem(storage);makePage(page)}};$('closeEditor').onclick=()=>{location.href=location.pathname};}window.addEventListener('resize',()=>{if(page==='principal')updateCountdown()});makePage('abertura');})();
</script></body></html>
