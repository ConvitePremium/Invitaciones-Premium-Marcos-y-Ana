(()=>{'use strict';const C=window.CONFIG,stage=document.querySelector('#stage'),editor=document.querySelector('#editor'),sel=document.querySelector('#areaSelect'),root=document.querySelector('#modalRoot');const clone=x=>JSON.parse(JSON.stringify(x));let positions=clone(C.posicoes),page='abertura',selected='confirmar',isEditor=new URLSearchParams(location.search).has('editor'),typingTimer=null,photoIndex=0,countdownTimer=null;const storage='convite-es-editor:'+location.pathname;try{positions={...positions,...JSON.parse(localStorage.getItem(storage)||'{}')}}catch(e){};const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function persistPositions(){try{localStorage.setItem(storage,JSON.stringify(positions))}catch(e){console.warn('Não foi possível salvar posições',e)}}function area(key,html,extra=''){let p=positions[key]||{x:10,y:10,w:40,h:10};return `<div class="area editable ${extra}" data-area="${key}" style="left:${p.x}%;top:${p.y}%;width:${p.w}%;height:${p.h}%">${html}<span class="handle"></span></div>`}function imageBg(path){return `<div class="fallback"></div><img class="bg" src="${esc(path)}" onerror="this.style.display='none'">`};function openingVideo(){if(!C.video?.ativo)return '';return `<video id="openingVideo" class="opening-video" src="${esc(C.video.arquivo||'assets/video.mp4')}" playsinline preload="auto" muted poster="${esc(C.imagens.abertura)}"></video>`}function nav(){return area('voltar','<button class="back" data-action="voltar">← Volver al inicio</button>')};function textBox(key,id){return area(key,`<div class="text-panel" id="${id}" style="width:100%;height:100%"></div>`)}function makePage(next){

sapp||'').replace(/\D/g,'');if(number.length<9){alert('Configura primero el número de WhatsApp en config.js.');return}const message=`¡Hola! Confirmamos nuestra asistencia a la boda de ${C.casal}.\nPersonas: ${n}\nNombres:\n${names.map((v,i)=>`${i+1}. ${v}`).join('\n')}`;window.open('https://wa.me/'+number+'?text='+encodeURIComponent(message),'_blank','noopener,noreferrer');root.innerHTML=''}}function attachEvents(){stage.querySelectorAll('[data-action]').forEach(btn=>btn.addEventListener('click',e=>{const a=btn.dataset.action;if(isEditor && a!=='next' && a!=='prev')return;if(a==='entrar'){startMusic();const v=$('openingVideo');if(v){v.muted=true;v.play().then(()=>{v.onended=()=>makePage('principal')}).catch(()=>makePage('principal'))}else{makePage('principal')}}else if(a==='voltar')makePage('principal');else if(a==='confirmar')showModal();else if(['localizacao','dresscode','historia','mensagem'].includes(a))makePage(a);else if(a==='next'||a==='prev'){photoIndex=(photoIndex+(a==='next'?1:-1)+clamp(C.historia.quantidadeFotos,3,6))%clamp(C.historia.quantidadeFotos,3,6);renderPhotos()}else if(a==='cerimonia'||a==='recepcao'){const url=C.localizacao[a].mapa;if(/^https:\/\//i.test(url))window.open(url,'_blank','noopener,noreferrer')}}));stage.querySelectorAll('.editable').forEach(el=>{el.addEventListener('pointerdown',e=>{if(!isEditor)return;if(e.target.closest('button')&&!e.target.classList.contains('handle'))e.preventDefault();const key=el.dataset.area;selectArea(key);const p=positions[key],startX=e.clientX,startY=e.clientY,initial={...p},resize=e.target.classList.contains('handle');el.setPointerCapture(e.pointerId);const move=ev=>{const dx=(ev.clientX-startX)/stage.clientWidth*100,dy=(ev.clientY-startY)/stage.clientHeight*100;if(resize){p.w=clamp(initial.w+dx,8,100-p.x);p.h=clamp(initial.h+dy,4,100-p.y)}else{p.x=clamp(initial.x+dx,0,100-p.w);p.y=clamp(initial.y+dy,0,100-p.h)}setAreaStyle(el,p);if(key==='contagem')updateCountdown();fillEditor()};const up=()=>{persistPos   const p=positions[selected];if(!p)return;
  ['x','y','w','h'].forEach(k=>$(k).value=Number(p[k]).toFixed(2));
  $('code').value='posicoes: '+JSON.stringify(positions,null,2);
}
function startMusic(){if(!C.musica.ativa)return;const a=$('audio');if(!a.src)a.src=C.musica.arquivo;a.volume=clamp(C.musica.volume??.3,0,1);a.play().then(()=>{music.textContent='♫';music.title='Pausar música'}).catch(()=>{music.textContent='▶';music.title='Ativar música';music.setAttribute('aria-label','Ativar música')})}const music=$('music');music.onclick=()=>{const a=$('audio');if(a.paused){startMusic()}else{a.pause();music.textContent='▶';music.title='Ativar música'}};if(C.musica.ativa){music.textContent='▶';music.title='Ativar música';music.setAttribute('aria-label','Ativar música')}else music.style.display='none';if(isEditor){document.body.classList.add('editor-mode');editor.classList.remove('hidden');$('paginaEditor').onchange=()=>{
  const destino=$('paginaEditor').value;
  if(!paginasEditor[destino])return;
  selected=paginasEditor[destino][0];
  makePage(destino);
};
sel.onchange=()=>{
  const key=sel.value;
  if(!paginasEditor[page]?.includes(key))return;
  selectArea(key);
};['x','y','w','h'].forEach(k=>$(k).oninput=()=>{const p=positions[selected];p[k]=Number($(k).value);const el=stage.querySelector(`[data-area="${selected}"]`);if(el)setAreaStyle(el,p);if(selected==='contagem')updateCountdown();persistPositions();$('code').value='posicoes: '+JSON.stringify(positions,null,2)});$('save').onclick=()=>{persistPositions();alert('Posições salvas neste navegador.')};$('copy').onclick=()=>{const code='posicoes: '+JSON.stringify(positions,null,2);navigator.clipboard.writeText(code).then(()=>alert('Código copiado. Cole em config.js.')).catch(()=>{prompt('Copie o código:',code)})};$('reset').onclick=()=>{if(confirm('Restaurar as posições originais?')){positions=clone(C.posicoes);localStorage.removeItem(storage);makePage(page)}};$('closeEditor').onclick=()=>{location.href=location.pathname};}window.addEventListener('resize',()=>{if(page==='principal')updateCountdown()});makePage(isEditor?'principal':'abertura');})();
</script></body></html>
